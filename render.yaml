# Public demo, on Render's free plan.
#
# Two things shape this file. The service has no persistent disk, on purpose:
# whatever a visitor does lasts until the next restart, and the demo folders are
# rebuilt from the image — that is the reset, and there is nothing to schedule.
# And the demo account is an administrator, which is only safe because the
# terminal is off: an admin with a terminal is a shell in the container for
# anyone who reads the login box.
#
# Deploy: Render → New → Blueprint → point it at this repository.
services:
  - type: web
    name: nextexplorer-demo
    runtime: docker
    dockerfilePath: ./demo/Dockerfile
    dockerContext: ./demo
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz

    envVars:
      # Written out rather than taken from `fromService … property: host`,
      # which yields a bare hostname with no scheme. `new URL()` rejects that,
      # so the value was parsed, discarded with a warning nobody reads, and the
      # application ran with no canonical URL at all. Share links survived only
      # because they fall back to the request host.
      - key: PUBLIC_URL
        value: https://nextexplorer-demo.onrender.com

      # Not negotiable on a public instance. The terminal is admin-only, and
      # the demo account below is an admin.
      - key: TERMINAL_ENABLED
        value: 'false'

      # Sharing is on: creating a public link is one of the things people come
      # to a file manager to try, and hiding it hides a whole feature. What
      # keeps it from becoming a file host is the lack of a disk — every link
      # dies with the instance, which on a plan that sleeps is several times a
      # day.
      - key: SHARES_ENABLED
        value: 'true'

      - key: AUTH_MODE
        value: local
      - key: AUTH_ADMIN_EMAIL
        value: demo@example.com
      # Published on purpose — this is the demo login. Six characters minimum:
      # below that the bootstrap is skipped with only a line in the log, and the
      # first visitor is met by the setup wizard instead of the demo.
      - key: AUTH_ADMIN_PASSWORD
        value: demo1234
      # Sessions live as long as the instance does; there is nothing to keep.
      - key: SESSION_SECRET
        generateValue: true

      # Chunked uploads on, so the demo shows what a large upload actually does.
      - key: UPLOAD_CHUNKED_ENABLED
        value: 'true'
      # Stop accepting uploads well before the instance disk is full: a demo
      # that runs out of space stops being a demo.
      - key: UPLOAD_STORAGE_RESERVE
        value: 512M
      - key: MAX_FILES_PER_UPLOAD
        value: '20'

      # Folder sizes computed all the way down, and the usage bar shown with
      # them: on a demo the point is to see the feature, and the content is
      # small enough that walking it costs little. Thumbnail concurrency is a
      # runtime setting rather than a variable — lower it in Settings → Files &
      # thumbnails if the instance struggles.
      - key: FOLDER_SIZE_MODE
        value: full
      - key: SHOW_VOLUME_USAGE
        value: 'true'
      # Full mode on a tenth of a CPU: reconcile in small batches, pause
      # between them, and never rescan more than hourly. The walk then happens
      # in the background without competing with the browsing it exists to
      # annotate.
      - key: FOLDER_SIZE_RECONCILE_BATCH
        value: '20'
      - key: FOLDER_SIZE_RECONCILE_PAUSE_MS
        value: '1000'
      - key: FOLDER_SIZE_RECONCILE_MIN_MS
        value: '3600000'

      - key: LOG_LEVEL
        value: warn
