name: Clean up old container images

# The registry gains a version per build, and a multi-arch image is several of
# them: an index, plus one manifest per architecture that carries no tag. The
# obvious cleanup — delete untagged versions — takes those with it, and the
# published image stops working for whoever pulls it on that architecture.
# scripts/prune-images.js reads each kept index and keeps what it points at.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (otherwise only lists what would go)'
        type: boolean
        default: false

jobs:
  prune:
    name: Prune container images
    runs-on: ubuntu-latest
    # `packages: write` was never what deleted anything: the step below hands
    # prune-images.js PACKAGE_CLEANUP_TOKEN, because GITHUB_TOKEN cannot delete
    # a personal package at all (see the note on that env). So the grant bought
    # nothing and is dropped; what is left is the checkout's read.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prune
        env:
          # GITHUB_TOKEN cannot delete a personal package: GitHub's API takes
          # only an OAuth app token or a personal access token (classic) with
          # read:packages and delete:packages for it. Without that secret the
          # run deletes nothing, and says so on the run's summary.
          GITHUB_TOKEN: ${{ secrets.PACKAGE_CLEANUP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning title=No image deleted::PACKAGE_CLEANUP_TOKEN is not set. Store a personal access token (classic) with read:packages and delete:packages under that name in the repository secrets."
            exit 0
          fi
          # The weekly run deletes; a manual run only lists unless asked to.
          # `inputs` is empty on a schedule, so reading it alone made every
          # weekly run a dry run, with or without the token.
          node scripts/prune-images.js ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
