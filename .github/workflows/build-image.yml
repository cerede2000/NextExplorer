name: Build image

# The image build itself, once, called by whoever needs it.
#
# There were two copies of these steps — one for the images a release ships,
# one for the `test` images the integration branch publishes — and they drifted:
# the version tag was added to one and not the other, so `3.0.2` existed for the
# full image and not for the lean one. What differs between the two is policy
# (which tags, which architectures, which registries), and that lives in the
# callers. What is identical is the mechanics, and that lives here.
on:
  workflow_call:
    inputs:
      channel:
        description: "'release' for the images main publishes, 'test' for the integration branch"
        required: true
        type: string
      platforms:
        description: 'Architectures to build for'
        type: string
        default: linux/amd64
      cache_scope_prefix:
        description: 'Prefix of the GitHub Actions cache scope, one per channel'
        required: true
        type: string
      push:
        description: 'Build without publishing when false — how the release path is tried from a branch'
        type: boolean
        default: true

env:
  IMAGE_NAME: explorer
  # Empty unless Docker Hub credentials are configured for this repository.
  # Every Docker Hub step is skipped when it is, so a build still publishes to
  # GHCR rather than failing at the login.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: ${{ inputs.channel }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Three hours, which is far more than any of these takes, and it is the
    # lean image on arm64 that needs the room. That variant compiles ffmpeg,
    # and the release path builds arm64 under emulation on an amd64 runner:
    # the same compile that takes seventeen minutes natively had not finished
    # after forty-two, and the job was cut off at the old hour limit having
    # published nothing.
    #
    # A ceiling is not a fix. The layer cache makes the second build skip the
    # compile entirely, so this is only paid when that stage actually changes —
    # but paying an hour for it is why building each architecture on a runner
    # of its own is worth doing rather than emulating one of them.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full image carries hardware video acceleration and RAW photo
          # support; the lean one leaves both out, which is a great deal smaller
          # and all that is needed where neither is used.
          #
          # The lean image also builds its own ffmpeg, with the encoders
          # stripped out. That build has no VA-API, which is exactly why it
          # belongs here and not in the full image: this variant has already
          # given up hardware acceleration, so it costs nothing it still has.
          - variant: full
            suffix: ''
            extra_build_args: ''
          - variant: lean
            suffix: '-lean'
            extra_build_args: |
              INCLUDE_VAAPI=false
              INCLUDE_RAW=false
              FFMPEG_VARIANT=source
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only the multi-architecture build needs emulation. A test image is
      # amd64, and waiting on QEMU it will not use is time before something to try.
      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Work out the tags this channel publishes
        id: spec
        run: |
          if [ '${{ inputs.channel }}' = 'release' ]; then
            # package.json is the source of the number, so a push to main carries
            # a version tag too rather than only moving latest. scripts/version.js
            # keeps the manifests in step and CI checks it.
            NUMBER="$(node -p "require('./package.json').version")"
            if [ -z "$NUMBER" ]; then
              echo 'No version found in package.json; aborting.'
              exit 1
            fi

            # Git tags are written v3.1.0; image tags conventionally are not, and
            # `pull image:3.1.0` is what a reader of the release notes will type.
            # Publish both so neither form is a dead end. The variant suffix is
            # applied to all of these through `flavor` below, so the lean build
            # publishes 3.1.0-lean alongside latest-lean.
            {
              echo 'tags<<SPEC'
              echo 'type=raw,value=latest'
              echo 'type=sha,format=long'
              echo "type=raw,value=v$NUMBER"
              echo "type=raw,value=$NUMBER"
              echo SPEC
            } >> "$GITHUB_OUTPUT"
          else
            # The suffix is written into the values rather than applied through
            # `flavor`, which would put it after the commit instead of before it
            # and rename a tag that has always been test-lean-<sha>.
            {
              echo 'tags<<SPEC'
              echo "type=raw,value=test${{ matrix.suffix }}"
              echo "type=raw,value=test${{ matrix.suffix }}-${GITHUB_SHA}"
              echo SPEC
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ inputs.channel == 'release' && env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: ${{ steps.spec.outputs.tags }}
          # onlatest applies the suffix to `latest` too, so the lean build
          # publishes latest-lean rather than overwriting latest.
          flavor: ${{ inputs.channel == 'release' && format('suffix={0},onlatest=true', matrix.suffix) || '' }}

      - name: Log in to Docker Hub
        if: ${{ inputs.channel == 'release' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
            ${{ matrix.extra_build_args }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The scope names are the ones each channel already used: renaming one
          # throws away a warm cache and makes the next build slow for nothing.
          cache-from: type=gha,scope=${{ inputs.cache_scope_prefix }}${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope_prefix }}${{ matrix.variant }}

      # An image that names a commit it was not built from makes diagnosis
      # harder exactly when diagnosis matters: a startup banner said 06b739a
      # while the code inside was demonstrably f3f0389, and an afternoon was
      # spent reasoning about the wrong source. Rather than argue about how
      # that happens, the build proves it did not.
      - name: Check the image names the commit it was built from
        if: ${{ inputs.push }}
        run: |
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "Inspecting $tag"
          stamped="$(docker run --rm --entrypoint sh "$tag" -c 'printf "%s" "$GIT_COMMIT"')"
          if [ "$stamped" != "${{ github.sha }}" ]; then
            echo "::error::The image is stamped $stamped but was built from ${{ github.sha }}"
            exit 1
          fi
          echo "Stamped $stamped, which is the commit that was built."

      # The entrypoint used to renumber `appuser` and chown the volume
      # directories before dropping to it, all of which need root — so a
      # container started as a fixed user died at the first `groupmod`, before
      # the server existed. That is what Compose's `user:` gives, and what a
      # Kubernetes cluster enforcing the restricted Pod Security Standard
      # imposes. Reading the script is not proof; starting it is.
      - name: Check the image starts as a non-root user
        if: ${{ inputs.push }}
        run: |
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "Starting $tag as 1000:1000"
          if ! docker run --rm --user 1000:1000 "$tag" node -e 'process.exit(0)'; then
            echo "::error::The image does not start when the container is given a non-root user"
            exit 1
          fi
          echo "Started, and the command it was given ran."

          echo "Starting $tag as root, which must still renumber and drop to appuser"
          # Only the last line: the entrypoint narrates what it is doing on
          # stdout, and those lines come out of the same pipe as the command's.
          ran_as="$(docker run --rm -e PUID=1234 -e PGID=1234 "$tag" node -e 'console.log(`${process.getuid()}:${process.getgid()}`)' | tail -n 1)"
          if [ "$ran_as" != "1234:1234" ]; then
            echo "::error::Started as root the process should run as PUID:PGID, but ran as $ran_as"
            exit 1
          fi
          echo "Ran as $ran_as, which is the PUID:PGID that was asked for."

      # Each variant ships its own ffmpeg — Alpine's package in the full image,
      # one built from source in the lean one — and nothing proved either could
      # read a HEIC. verify-ffmpeg.sh took HEVC in MP4 as standing for it, which
      # it does not: an ffmpeg before 7.1 decodes the one and cannot open the
      # other. So each image is handed a real HEIC, and has to put red on the
      # left and blue on the right: reading only one tile, or flipping it, moves
      # those colours. Converted to RGB before the reduction to two pixels, since
      # in 4:2:0 the two would share one chroma sample and both come out purple.
      - name: Check the image's ffmpeg decodes a HEIC
        if: ${{ inputs.push }}
        run: |
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          pixels="$(docker run --rm --entrypoint ffmpeg \
              -v "$PWD/backend/tests/fixtures/half-red-half-blue.heic:/tmp/photo.heic:ro" "$tag" \
              -v error -i /tmp/photo.heic -frames:v 1 \
              -vf format=rgb24,scale=2:1:flags=area -f rawvideo -pix_fmt rgb24 - \
            | od -An -tu1)"
          echo "Decoded, as R G B left then right: $pixels"
          set -- $pixels
          if [ "$#" -ne 6 ] || [ "$1" -lt 200 ] || [ "$3" -gt 60 ] || [ "$4" -gt 60 ] || [ "$6" -lt 200 ]; then
            echo "::error::The image's ffmpeg did not decode the HEIC fixture to red on the left and blue on the right"
            exit 1
          fi
          echo "Red on the left, blue on the right."

