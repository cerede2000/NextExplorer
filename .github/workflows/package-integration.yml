name: Package test image

# The branch where work is stacked and tried out before it reaches main,
# published as `test` and `test-lean`. Two variants, the same pair a release
# publishes, so what is tried here is what ships: the full image, and the lean
# one without VA-API or RAW.
on:
  push:
    branches:
      - integration
  workflow_dispatch:

concurrency:
  group: package-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish test image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      channel: test
      # Both, now that each architecture builds on a runner of its own: they
      # run side by side rather than one waiting on the other through
      # emulation, so this no longer doubles the time between a push and
      # something to try. It also means the release path — two architectures,
      # a manifest assembled from digests — is exercised here before a release
      # ever depends on it, and that an arm64 homelab can try the branch.
      platforms: linux/amd64,linux/arm64
      cache_scope_prefix: integration-
    secrets: inherit
