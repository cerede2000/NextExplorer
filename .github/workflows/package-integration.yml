name: Package test image

# The branch where work is stacked and tried out before it reaches main,
# published as `test` and `test-lean`. Two variants, the same pair a release
# publishes, so what is tried here is what ships: the full image, and the lean
# one without VA-API or RAW.
on:
  push:
    branches:
      - integration
  workflow_dispatch:

env:
  IMAGE_NAME: explorer

concurrency:
  group: package-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish test image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            tag: test
            extra_build_args: ''
          - variant: lean
            tag: test-lean
            extra_build_args: |
              INCLUDE_VAAPI=false
              INCLUDE_RAW=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
            ${{ matrix.extra_build_args }}
          push: true
          # amd64 only: this is a test image, and waiting on an arm64 build
          # doubles the time between a push and something to try.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache scope keeps its old name on purpose: renaming it would throw
          # away a warm cache and make the next push slow for nothing.
          cache-from: type=gha,scope=integration-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=integration-${{ matrix.variant }}
