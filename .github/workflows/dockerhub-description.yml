name: Sync Docker Hub description

# The Docker Hub page is the README, and it was only rewritten when a release
# went out. Anything changed in between — a new demo address, a corrected
# instruction — sat there stale until the next version, on the page most people
# reach before the repository.
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

env:
  IMAGE_NAME: explorer
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

# This run pushes to Docker Hub with a Docker Hub token; it wants nothing at
# all from GITHUB_TOKEN beyond reading the README it is about to publish.
permissions:
  contents: read

jobs:
  sync:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    # Nothing to do where Docker Hub credentials are not configured.
    if: ${{ github.repository_owner != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update description
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        # v3 runs on node16, a runtime the runner no longer offers; GitHub has
        # been forcing such actions onto a newer one, and that is a courtesy
        # rather than a guarantee. v5 is the current major and takes the same
        # inputs this step already passes.
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: README.md
