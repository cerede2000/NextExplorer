name: Build and Publish Docker Image

# latest and latest-lean follow main, so a fix reaches the images — and the
# demo running on them — without waiting for a release. Version tags stay tied
# to releases: `explorer:3.0.2` means the release of that name, not whatever
# main happened to hold.
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

env:
  IMAGE_NAME: explorer
  # Empty unless Docker Hub credentials are configured for this repository.
  # Every Docker Hub step is skipped when it is, so a build still publishes to
  # GHCR rather than failing at the login.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full image carries hardware video acceleration and RAW photo
          # support; the lean one leaves both out, which is a great deal smaller
          # and all that is needed where neither is used.
          - variant: full
            suffix: ''
            extra_build_args: ''
          - variant: lean
            suffix: '-lean'
            extra_build_args: |
              INCLUDE_VAAPI=false
              INCLUDE_RAW=false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Determine release tag
        id: version
        if: github.event_name == 'release'
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [ -z "$VERSION_TAG" ]; then
            echo "Release tag not detected; aborting."
            exit 1
          fi
          # Git tags are written v3.0.0; image tags conventionally are not, and
          # `pull image:3.0.0` is what a reader of the release notes will type.
          # Publish both so neither form is a dead end.
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          # Blank lines are ignored, so the version tags simply do not exist
          # on a push to main.
          tags: |
            type=raw,value=latest
            type=sha,format=long
            ${{ github.event_name == 'release' && format('type=raw,value={0}', steps.version.outputs.version) || '' }}
            ${{ github.event_name == 'release' && format('type=raw,value={0}', steps.version.outputs.number) || '' }}
          # onlatest applies the suffix to `latest` too, so the lean build
          # publishes latest-lean rather than overwriting latest.
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
            ${{ matrix.extra_build_args }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Update Docker Hub description
        if: ${{ github.event_name == 'release' && env.DOCKERHUB_USERNAME != '' && matrix.variant == 'full' }}
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: ${{ github.event.release.name || github.event.repository.description }}
          readme-filepath: README.md
