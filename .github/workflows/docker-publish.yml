name: Build and Publish Docker Image

# latest and latest-lean follow main, so a fix reaches the images — and the
# demo running on them — without waiting for a release. The version in
# package.json is published alongside them, which is why a release does not
# build anything: cutting v3.1.0 from main asks for images main has already
# produced, and building them twice took twenty minutes of runner time to push
# the same digests to the same tags. What the release event still does is check
# that the tag it was cut from and the manifests agree.
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing. How this path is tried from a branch before it can reach main.'
        type: boolean
        default: false

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release publishes no image of its own; it names ones that already exist.
  # Refusing a tag the code does not carry is the part worth keeping, and it
  # costs seconds rather than a pair of multi-architecture builds.
  verify-release-tag:
    name: Release tag matches the manifests
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare the tag with package.json
        run: |
          NUMBER="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$NUMBER" ]; then
            echo "Release $GITHUB_REF_NAME does not match package.json ($NUMBER)."
            echo "The images tagged $NUMBER are not what this release names."
            exit 1
          fi
          echo "Release $GITHUB_REF_NAME matches package.json ($NUMBER)."

  build:
    name: Build and publish
    if: github.event_name != 'release'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      channel: release
      platforms: linux/amd64,linux/arm64
      # The scope these builds have always used. Empty because the variant name
      # alone is the whole scope here, where the test channel prefixes its own.
      cache_scope_prefix: ''
      # Unset on every event but a manual one, where `!null` is true — so only
      # someone asking for a dry run gets a build that publishes nothing.
      push: ${{ !inputs.dry_run }}
    secrets: inherit
