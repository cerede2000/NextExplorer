name: Clean up stale build caches

# The layer cache is what keeps a build from recompiling ffmpeg, and it has a
# ceiling: 10 GiB per repository, after which GitHub evicts whatever was least
# recently used. This repository reached it — 956 entries — and what went was
# the release scopes, which are only touched when main moves. The 3.8.1 lean
# image paid fifty-seven minutes for that, where the two releases before it had
# paid ten.
#
# Renaming a scope orphans everything under the old name, and nothing ever
# collects it: the arch-split scopes introduced in d12a679 left four dead ones
# holding gigabytes that will never be read again. So this removes what has not
# been read in a fortnight, which is exactly what an orphan is, and leaves
# everything a build still uses alone.
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (otherwise only lists what would go)'
        type: boolean
        default: false
      days:
        description: 'Keep caches read within this many days'
        type: string
        default: '14'

permissions:
  contents: read

jobs:
  prune:
    name: Prune caches
    runs-on: ubuntu-24.04
    permissions:
      # Deleting a cache is an action on the repository's Actions data, which
      # is what this scope covers; nothing else here writes anything.
      actions: write
      contents: read
    steps:
      - name: Take stock, then take out what nothing reads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply || 'false' }}
          DAYS: ${{ inputs.days || '14' }}
        run: |
          set -euo pipefail

          usage() {
            gh api "repos/$REPO/actions/cache/usage" \
              --jq '"\(.active_caches_count) entrées, \(.active_caches_size_in_bytes / 1073741824 * 100 | floor / 100) Gio"'
          }
          echo "Before: $(usage)"

          cutoff="$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Anything last read before $cutoff is an orphan by this rule."

          # Every page, oldest read first. A repository at the ceiling has
          # hundreds of entries, and the default page is thirty.
          gh api --paginate "repos/$REPO/actions/caches?per_page=100&sort=last_accessed_at&direction=asc" \
            --jq '.actions_caches[] | [.id, .last_accessed_at, (.size_in_bytes / 1048576 | floor), .key] | @tsv' \
            > /tmp/caches.tsv || true

          total=0
          freed=0
          while IFS=$'\t' read -r id accessed megabytes key; do
            total=$((total + 1))
            if [[ "$accessed" < "$cutoff" ]]; then
              printf '  %s  %6s MiB  %s  %s\n' "$accessed" "$megabytes" "${key:0:60}" \
                "$([ "$APPLY" = 'true' ] && echo 'deleting' || echo 'would delete')"
              freed=$((freed + megabytes))
              if [ "$APPLY" = 'true' ]; then
                gh api --method DELETE "repos/$REPO/actions/caches/$id" >/dev/null || \
                  echo "    (could not delete $id)"
              fi
            fi
          done < /tmp/caches.tsv

          echo
          echo "$total entries read; ${freed} MiB $([ "$APPLY" = 'true' ] && echo 'freed' || echo 'would be freed')."
          [ "$APPLY" = 'true' ] && echo "After: $(usage)" || true
