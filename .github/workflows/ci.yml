name: CI

# Nothing used to run the test suites: they existed, passed locally, and no
# workflow ever executed them. Any change could quietly undo a fix.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches engines.node and the runtime image.
          node-version: 24
          cache: npm

      # 7-Zip backs archive extraction and compression; without it those
      # suites fall back to the bundled JS path and skip the guards.
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build

      - name: Demo image builds
        # The demo is deployed from demo/Dockerfile. Building it here means a
        # change that breaks it fails now, rather than the next time someone
        # redeploys the public demo.
        run: docker build -f demo/Dockerfile demo/
