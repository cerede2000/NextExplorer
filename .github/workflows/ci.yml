name: CI

# Nothing used to run the test suites: they existed, passed locally, and no
# workflow ever executed them. Any change could quietly undo a fix.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# With no block here the jobs take whatever the repository hands out by
# default, which for a repository that has never been narrowed is write on
# every scope. Nothing below writes anything: it reads the checkout, installs,
# and runs the suites. A `pull_request` from a fork is read-only whatever this
# says — a push to a branch in the repository is not, and that is the run this
# protects.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit check below reads every commit a push brings, which a
          # shallow clone of the tip does not have.
          fetch-depth: 0

      # A change in behaviour arrives with the test that holds it, in the same
      # commit, or says why not with a `No-test:` trailer. First, because it
      # needs nothing installed and a refusal here should not wait on the suites.
      - name: Every code change carries its test
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD" ;;
            push)
              head="$HEAD_SHA"
              # Everything the branch carries that main does not, rather than
              # what this push added. A push that follows another closely
              # cancels the run in flight, and the commits it was reading are
              # never read again — the next push starts from the commit it
              # pushed over. Two reached main through that gap and the refusal
              # arrived on the release, where the history can no longer be
              # changed. Re-reading what is unreleased costs a second and
              # leaves no gap. On main there is nothing to compare against, so
              # the push's own range stands as the last backstop.
              if [ "$BRANCH" = "main" ]; then
                base="$BEFORE"
              else
                base="$(git merge-base origin/main "$head" 2>/dev/null || true)"
              fi ;;
            *)
              echo "Nothing to compare on $EVENT."
              exit 0 ;;
          esac
          # A new branch has no `before`, and a force push can leave one that is
          # no longer in the history: fall back to where the branch left main.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "$head" 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Nothing to compare $head against."
            exit 0
          fi
          scripts/check-commit-tests.sh "${base}..${head}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Matches engines.node and the runtime image.
          node-version: 24
          cache: npm

      # 7-Zip backs archive extraction, ripgrep backs content search, and
      # pdftotext reads the words in a PDF. Without
      # ripgrep here the suites fall back to the JavaScript scan and the path
      # nearly every deployment actually runs goes untested — which is how a
      # setting that made ripgrep refuse its own flag reached a release.
      #
      # ffmpeg makes the video and HEIC thumbnail paths runnable at all. Ubuntu
      # 24.04 carries 6.1, which predates the HEIF demuxer, so the HEIC suites
      # skip here — reported as skipped — and run in the media job below, on the
      # ffmpeg the image ships.
      #
      # rsync is what copies files and folders on Linux: FILE_TRANSFER_ENGINE is
      # native there, and the image ships it. A Mac has only openrsync, which the
      # service cannot use, so the native copy suites run here or nowhere.
      - name: Install 7-Zip, ripgrep, poppler, ffmpeg, rsync and genisoimage
        run: sudo apt-get update && sudo apt-get install -y p7zip-full ripgrep poppler-utils ffmpeg rsync genisoimage

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Lint
        run: npm run lint

      # Prettier was configured, and a format script existed, and nothing ran
      # either: 63 files had drifted out of the style the repository declares.
      # Formatted once and held here, so the next diff is about what changed
      # rather than about where the line breaks went.
      - name: Formatting
        run: npm run format:check

      # Run under coverage rather than beside it: it is the same suite with
      # instrumentation, so it costs one extra pass of nothing, and it produces
      # a number. Without this there was no coverage figure anywhere — and for
      # a while there could not be one, because two bcryptjs-heavy tests went
      # over the default five-second timeout once instrumented. They carry their
      # own timeout now, with the reason written beside them.
      - name: Backend tests
        run: npm run test:coverage:backend
        env:
          # ffmpeg, 7-Zip and an ISO builder were installed above on purpose:
          # the suites that need them must run, not skip because an apt change
          # quietly dropped one. Reading an archive's table of contents is
          # 7-Zip's answer, and a machine without it runs the stand-in and never
          # the real thing; the ISO builder is what lets the one format that is
          # a filesystem rather than an archive be covered without a binary
          # fixture in the repository.
          REQUIRE_MEDIA_TOOLS: ffmpeg,7z,iso
          # The trash refuses a zone on another disk. That refusal is proven
          # against a real second device — /dev/shm beside the runner's disk —
          # which a Mac does not have, so locally the test skips; here a missing
          # device is a failure rather than a quiet skip.
          REQUIRE_CROSS_DEVICE: '1'
          # Likewise the copies through rsync, installed above: a runner without
          # a usable one fails instead of skipping the engine deployments run.
          REQUIRE_NATIVE_RSYNC: '1'

      - name: Frontend tests
        run: npm run test:coverage:frontend

      # `always()` so a red suite still reports what it managed to cover, and
      # tolerant of the files being absent: when an earlier step fails, no
      # coverage was produced at all, and this must not add a second failure on
      # top of the real one.
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          [ -f backend/coverage/coverage-summary.json ] || exit 0
          [ -f frontend/coverage/coverage-summary.json ] || exit 0
          {
            echo '## Coverage'
            echo
            echo '### Backend'
            echo '```'
            node -e "const s=require('./backend/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12)+s[k].pct+'%')"
            echo '```'
            echo '### Frontend'
            echo '```'
            node -e "const s=require('./frontend/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12)+s[k].pct+'%')"
            echo '```'
            echo
            echo '### Where the gaps are'
            echo
            echo 'Ranked by uncovered statements rather than by percentage: a small file at 40% matters less than a large one at 70%.'
            echo
            echo '```'
            node -e "
              const rank = (file, label) => {
                const s = require(file);
                const rows = Object.entries(s)
                  .filter(([f]) => f !== 'total')
                  .map(([f, v]) => ({
                    f: f.replace(/.*\/(backend|frontend)\/src\//, ''),
                    u: v.statements.total - v.statements.covered,
                    p: v.statements.pct,
                    b: v.branches.pct,
                  }))
                  .filter((r) => r.u >= 25)
                  .sort((a, b) => b.u - a.u)
                  .slice(0, 12);
                console.log(label);
                console.log('  missed  stmt%  branch%  file');
                for (const r of rows) {
                  console.log(String(r.u).padStart(8), String(r.p).padStart(6), String(r.b).padStart(8), ' ' + r.f);
                }
                console.log('');
              };
              rank('./backend/coverage/coverage-summary.json', 'backend');
              rank('./frontend/coverage/coverage-summary.json', 'frontend');
            "
            echo '```'
            # Through tee, so the numbers are readable from the log as well as
            # from the rendered summary — one of them is reachable with a
            # command, and the other needs a browser.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The floors in coverage-thresholds.json fail the test steps above when
      # coverage drops. They only protect what they are set to, so a floor left
      # well below the figure lets that much slip back unnoticed: this says when
      # one can be raised and still keep half a point of room.
      - name: Coverage floors
        if: always()
        continue-on-error: true
        run: |
          [ -f backend/coverage/coverage-summary.json ] || exit 0
          [ -f frontend/coverage/coverage-summary.json ] || exit 0
          node -e "
            const floors = require('./coverage-thresholds.json');
            for (const side of ['backend', 'frontend']) {
              const total = require('./' + side + '/coverage/coverage-summary.json').total;
              for (const k of ['statements', 'branches', 'functions', 'lines']) {
                const actual = total[k].pct;
                const floor = floors[side][k];
                // The highest whole number that still leaves half a point of
                // room: any closer and a run that misses a few lines reds.
                const suggested = Math.floor(actual - 0.5);
                console.log(side.padEnd(9) + k.padEnd(11) + String(actual).padStart(6) + '%  floor ' + floor + '%');
                if (suggested > floor) {
                  console.log('::notice title=Coverage floor::' + side + ' ' + k + ' is at ' + actual + '%, floor ' + floor + '% — raise it to ' + suggested + ' in coverage-thresholds.json');
                }
              }
            }
          "

      - name: Frontend build
        run: npm run build

      # The browser tests were written, then never run by anything — and they
      # had been broken the whole time: the fixtures mounted the component
      # without vue-i18n, so nothing rendered and every assertion failed on a
      # missing element. Layout is the one thing a jsdom unit test cannot check,
      # and a video escaping its container shipped because of that gap, so this
      # runs where layout exists.
      - name: Browser tests
        run: npm run test:e2e

      - name: Demo image builds
        # The demo is deployed from demo/Dockerfile. Building it here means a
        # change that breaks it fails now, rather than the next time someone
        # redeploys the public demo.
        run: docker build -f demo/Dockerfile demo/

  # The HEIC suites need an ffmpeg that reads HEIF, which the runner's 6.1
  # cannot: there they skip. Here they run on the base the image is built from,
  # read from the Dockerfile so the two cannot drift, with Alpine's ffmpeg —
  # the recipe the full image installs, built at a newer version when Alpine's
  # package lags — and HEIF is required, so a skip cannot hide in this job. Until this existed, the HEIC decode assertions had never
  # run on any CI machine, while reporting green on every one.
  media:
    name: Media suites, with the image's ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the ffmpeg and HEIC suites on the image's base
        run: |
          base="$(awk '$1 == "FROM" && $NF == "base" { print $2 }' Dockerfile)"
          [ -n "$base" ] || { echo "::error::No base stage found in the Dockerfile"; exit 1; }
          echo "Base image: $base"

          # The registry answers an anonymous pull with "toomanyrequests" when
          # enough runners ask at once, and this job then fails for a reason
          # that has nothing to do with the suites it runs. Pulled separately,
          # with a few waits, so that the run that follows is about ffmpeg.
          for attempt in 1 2 3 4 5; do
            docker pull "$base" && break
            [ "$attempt" = 5 ] && { echo "::error::Could not pull $base after 5 tries"; exit 1; }
            echo "Pull refused; waiting $((attempt * 30))s"
            sleep $((attempt * 30))
          done

          docker run --rm -v "$PWD:/work" -w /work "$base" sh -euc '
            apk add --no-cache ffmpeg python3 make g++ >/dev/null
            ffmpeg -version | head -n 1
            npm ci --workspace backend --no-audit --no-fund >/dev/null
            cd backend
            REQUIRE_MEDIA_TOOLS=ffmpeg,heif npx vitest run \
              tests/services/heic-thumbnail.test.js \
              tests/services/ffmpeg-thumbnails.test.js \
              tests/services/ffmpeg-failure-reporting.test.js \
              tests/services/media-tracks.test.js \
              tests/routes/media-tracks-route.test.js
          '
