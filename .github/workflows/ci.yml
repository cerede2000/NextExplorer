name: CI

# Nothing used to run the test suites: they existed, passed locally, and no
# workflow ever executed them. Any change could quietly undo a fix.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The commit check below reads every commit a push brings, which a
          # shallow clone of the tip does not have.
          fetch-depth: 0

      # A change in behaviour arrives with the test that holds it, in the same
      # commit, or says why not with a `No-test:` trailer. First, because it
      # needs nothing installed and a refusal here should not wait on the suites.
      - name: Every code change carries its test
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}" ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}" ;;
            *)
              echo "Nothing to compare on ${{ github.event_name }}."
              exit 0 ;;
          esac
          # A new branch has no `before`, and a force push can leave one that is
          # no longer in the history: fall back to where the branch left main.
          if [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "$head")"
          fi
          scripts/check-commit-tests.sh "${base}..${head}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches engines.node and the runtime image.
          node-version: 24
          cache: npm

      # 7-Zip backs archive extraction, ripgrep backs content search, and
      # pdftotext reads the words in a PDF. Without
      # ripgrep here the suites fall back to the JavaScript scan and the path
      # nearly every deployment actually runs goes untested — which is how a
      # setting that made ripgrep refuse its own flag reached a release.
      #
      # ffmpeg makes the video and HEIC thumbnail paths runnable at all. Note
      # that Ubuntu 24.04 carries 6.1, which predates the HEIF demuxer: the HEIC
      # decode assertions announce themselves as skipped here and run against
      # the 8.0.1 in the runtime image.
      - name: Install 7-Zip, ripgrep, poppler and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y p7zip-full ripgrep poppler-utils ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Lint
        run: npm run lint

      # Run under coverage rather than beside it: it is the same suite with
      # instrumentation, so it costs one extra pass of nothing, and it produces
      # a number. Without this there was no coverage figure anywhere — and for
      # a while there could not be one, because two bcryptjs-heavy tests went
      # over the default five-second timeout once instrumented. They carry their
      # own timeout now, with the reason written beside them.
      - name: Backend tests
        run: npm run test:coverage:backend

      - name: Frontend tests
        run: npm run test:coverage:frontend

      # `always()` so a red suite still reports what it managed to cover, and
      # tolerant of the files being absent: when an earlier step fails, no
      # coverage was produced at all, and this must not add a second failure on
      # top of the real one.
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          [ -f backend/coverage/coverage-summary.json ] || exit 0
          [ -f frontend/coverage/coverage-summary.json ] || exit 0
          {
            echo '## Coverage'
            echo
            echo '### Backend'
            echo '```'
            node -e "const s=require('./backend/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12)+s[k].pct+'%')"
            echo '```'
            echo '### Frontend'
            echo '```'
            node -e "const s=require('./frontend/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12)+s[k].pct+'%')"
            echo '```'
            echo
            echo '### Where the gaps are'
            echo
            echo 'Ranked by uncovered statements rather than by percentage: a small file at 40% matters less than a large one at 70%.'
            echo
            echo '```'
            node -e "
              const rank = (file, label) => {
                const s = require(file);
                const rows = Object.entries(s)
                  .filter(([f]) => f !== 'total')
                  .map(([f, v]) => ({
                    f: f.replace(/.*\/(backend|frontend)\/src\//, ''),
                    u: v.statements.total - v.statements.covered,
                    p: v.statements.pct,
                    b: v.branches.pct,
                  }))
                  .filter((r) => r.u >= 25)
                  .sort((a, b) => b.u - a.u)
                  .slice(0, 12);
                console.log(label);
                console.log('  missed  stmt%  branch%  file');
                for (const r of rows) {
                  console.log(String(r.u).padStart(8), String(r.p).padStart(6), String(r.b).padStart(8), ' ' + r.f);
                }
                console.log('');
              };
              rank('./backend/coverage/coverage-summary.json', 'backend');
              rank('./frontend/coverage/coverage-summary.json', 'frontend');
            "
            echo '```'
            # Through tee, so the numbers are readable from the log as well as
            # from the rendered summary — one of them is reachable with a
            # command, and the other needs a browser.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The floors in coverage-thresholds.json fail the test steps above when
      # coverage drops. They only protect what they are set to, so a floor left
      # well below the figure lets that much slip back unnoticed: this says when
      # one can be raised and still keep half a point of room.
      - name: Coverage floors
        if: always()
        continue-on-error: true
        run: |
          [ -f backend/coverage/coverage-summary.json ] || exit 0
          [ -f frontend/coverage/coverage-summary.json ] || exit 0
          node -e "
            const floors = require('./coverage-thresholds.json');
            for (const side of ['backend', 'frontend']) {
              const total = require('./' + side + '/coverage/coverage-summary.json').total;
              for (const k of ['statements', 'branches', 'functions', 'lines']) {
                const actual = total[k].pct;
                const floor = floors[side][k];
                // The highest whole number that still leaves half a point of
                // room: any closer and a run that misses a few lines reds.
                const suggested = Math.floor(actual - 0.5);
                console.log(side.padEnd(9) + k.padEnd(11) + String(actual).padStart(6) + '%  floor ' + floor + '%');
                if (suggested > floor) {
                  console.log('::notice title=Coverage floor::' + side + ' ' + k + ' is at ' + actual + '%, floor ' + floor + '% — raise it to ' + suggested + ' in coverage-thresholds.json');
                }
              }
            }
          "

      - name: Frontend build
        run: npm run build

      # The browser tests were written, then never run by anything — and they
      # had been broken the whole time: the fixtures mounted the component
      # without vue-i18n, so nothing rendered and every assertion failed on a
      # missing element. Layout is the one thing a jsdom unit test cannot check,
      # and a video escaping its container shipped because of that gap, so this
      # runs where layout exists.
      - name: Browser tests
        run: npm run test:e2e

      - name: Demo image builds
        # The demo is deployed from demo/Dockerfile. Building it here means a
        # change that breaks it fails now, rather than the next time someone
        # redeploys the public demo.
        run: docker build -f demo/Dockerfile demo/
