name: Build and Publish FFmpeg Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified multi-architecture image
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - Dockerfile.ffmpeg
      - docker/verify-ffmpeg.sh
      - .github/workflows/ffmpeg-publish.yml

env:
  IMAGE_NAME: nextexplorer-ffmpeg
  FFMPEG_VERSION: 8.1.3

concurrency:
  group: ffmpeg-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FFmpeg image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3


      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native binaries
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ffmpeg
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.FFMPEG_VERSION }}
          cache-from: type=gha,scope=ffmpeg-image
          cache-to: type=gha,scope=ffmpeg-image,mode=min
