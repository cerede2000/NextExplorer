name: Standalone release archive

# The archive somebody installs without Docker, built the same way the images
# are: on every push to main, so a break is found on the commit that caused it,
# and again when a release is published — where it is attached to the release,
# because a release that names an installation method and does not carry it is
# a broken promise.
on:
  # The payload is the whole application, so anything can break it: no path
  # filter here.
  push:
    branches:
      - main
      # Like the test image beside it: a working branch builds and installs
      # the archive too, so a break is found before a release needs it. A
      # dispatch cannot reach a working branch — GitHub only offers that from
      # the default branch — so this trigger is also the only way to try it
      # from here.
      - integration
  release:
    types:
      - published
  # How a working branch tries this path before it can reach main:
  #   gh workflow run package-standalone.yml --ref integration
  workflow_dispatch:

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'

jobs:
  build:
    name: Assemble (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assemble the archive
        run: packaging/assemble.sh

      - name: What came out
        run: |
          ls -la dist-standalone/
          cat dist-standalone/*.sha256

      - name: Keep it for the other jobs
        uses: actions/upload-artifact@v5
        with:
          name: standalone-${{ matrix.arch }}
          path: |
            dist-standalone/*.tar.gz
            dist-standalone/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # The runner is a whole Ubuntu with systemd, root and an ephemeral disk, so
  # the install can be tried exactly as somebody will try it — service and all
  # — rather than approximated.
  install:
    name: Install it for real (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Take the archive
        uses: actions/download-artifact@v6
        with:
          name: standalone-${{ matrix.arch }}

      - name: Unpack it the way the instructions say
        run: |
          set -eux
          sha256sum -c ./*.tar.gz.sha256
          tar -xzf ./*.tar.gz
          echo "RELEASE_DIR=$(realpath "$(find . -maxdepth 1 -type d -name 'nextexplorer-*' | head -1)")" >> "$GITHUB_ENV"

      - name: Install
        run: sudo "$RELEASE_DIR/install.sh" --yes

      - name: The unit is one systemd has nothing to say about
        run: |
          set -eux
          # Its own parser, on the file that was installed rather than on the
          # template: `verify` resolves ExecStart, so it can only run once the
          # runtime is where the unit says it is.
          systemd-analyze verify /etc/systemd/system/nextexplorer.service

      - name: It is running, and answering
        run: |
          set -eux
          systemctl is-active --quiet nextexplorer
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health
          features="$(curl -fsS http://127.0.0.1:3000/api/features)"
          echo "$features" | head -c 400
          expected="$(cat "$RELEASE_DIR/VERSION")"
          echo "$features" | grep -q "\"app\":\"$expected\"" \
            || { echo "The running application does not report $expected"; exit 1; }
          # The bundled 7-Zip is the build with the RAR codec, and the unit's
          # PATH is what puts it in front of anything the distribution has. If
          # that line is wrong, this list is missing rar and nothing else says so.
          echo "$features" | grep -q '"rar"' \
            || { echo "The bundled 7-Zip was not found through the unit's PATH"; exit 1; }
          # A shell on the host is not something an installation opens by itself.
          # Read with sudo on purpose: the configuration may hold a secret, so
          # the installer leaves it 0640 root:nextexplorer, and an ordinary
          # account being unable to read it is part of what is being checked.
          sudo grep -q '^TERMINAL_ENABLED=false' /etc/nextexplorer/nextexplorer.env
          test "$(stat -c '%a %U:%G' /etc/nextexplorer/nextexplorer.env)" = '640 root:nextexplorer'

      - name: The tools it said it would install are there
        run: |
          set -eux
          for tool in ffprobe rg pdftotext perl rsync; do
            command -v "$tool" >/dev/null || { echo "$tool was not installed"; exit 1; }
          done

      - name: Running it again keeps what is the operator's
        run: |
          set -eux
          printf 'PUBLIC_URL=https://files.example.test\n' | sudo tee -a /etc/nextexplorer/nextexplorer.env >/dev/null
          sudo install -d -o nextexplorer -g nextexplorer /srv/nextexplorer/Photos
          sudo touch /var/lib/nextexplorer/proof-of-data
          sudo "$RELEASE_DIR/install.sh" --yes
          sudo grep -q 'PUBLIC_URL=https://files.example.test' /etc/nextexplorer/nextexplorer.env
          test -e /var/lib/nextexplorer/proof-of-data
          test -d /srv/nextexplorer/Photos
          systemctl is-active --quiet nextexplorer

      - name: The update command reads the published release
        run: |
          set -eux
          # --check changes nothing, and on a machine holding an unreleased
          # build it is allowed to report either answer; what is being tested
          # is that it can read the release feed and compare.
          sudo nextexplorer-upgrade --check | tee /tmp/upgrade-check
          grep -q 'installed:' /tmp/upgrade-check
          grep -q 'published:' /tmp/upgrade-check

      - name: Taking it off keeps the data
        run: |
          set -eux
          sudo touch /var/lib/nextexplorer/still-here
          sudo "$RELEASE_DIR/install.sh" --uninstall
          test ! -e /etc/systemd/system/nextexplorer.service
          test ! -d /opt/nextexplorer
          test -e /var/lib/nextexplorer/still-here
          test -e /etc/nextexplorer/nextexplorer.env
          systemctl is-active nextexplorer && { echo "still running"; exit 1; } || true

  # The documentation's own procedure, run as written. A page that tells
  # somebody to install by hand is a promise about the archive, and this is
  # what keeps the two from drifting: the commands are lifted out of the page
  # rather than copied here.
  by-hand:
    name: The procedure in the documentation
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Take the archive
        uses: actions/download-artifact@v6
        with:
          name: standalone-x64
          path: artifact

      - name: Unpack
        run: |
          set -eux
          tar -xzf artifact/*.tar.gz
          echo "RELEASE_DIR=$(realpath "$(find . -maxdepth 1 -type d -name 'nextexplorer-*' | head -1)")" >> "$GITHUB_ENV"

      - name: Lift the commands out of the page
        run: |
          set -eu
          python3 - <<'PY' > /tmp/by-hand.sh
          import pathlib, re
          page = pathlib.Path('docs/installation/standalone.md').read_text(encoding='utf-8')
          body = page.split('<!-- by-hand:start -->')[1].split('<!-- by-hand:end -->')[0]
          blocks = re.findall(r'```sh\n(.*?)```', body, re.S)
          assert len(blocks) >= 4, f'only {len(blocks)} blocks found between the markers'
          print('set -eux')
          print('\n'.join(blocks))
          PY
          cat /tmp/by-hand.sh

      - name: Run them, from inside the archive as the page says
        run: |
          set -eux
          cd "$RELEASE_DIR"
          bash /tmp/by-hand.sh
          systemctl is-active --quiet nextexplorer

      - name: A volume, the way the page adds one
        run: |
          set -eux
          sudo install -d -o nextexplorer -g nextexplorer /srv/nextexplorer/Files
          sudo systemctl restart nextexplorer
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/features | grep -q '"app":"'"$(cat "$RELEASE_DIR/VERSION")"'"'

      - name: What the program directory looks like before it is used
        run: |
          set -eu
          sudo find /opt/nextexplorer -type f -exec sha256sum {} + | sort > /tmp/before.sums
          wc -l < /tmp/before.sums

      - name: Use it — an account, an upload, a thumbnail
        run: |
          set -eux
          jar=/tmp/cookies
          curl -fsS -c $jar -b $jar -X POST http://127.0.0.1:3000/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.test","username":"owner","password":"secret123"}' \
            -o /dev/null
          # A real PNG, so the image processor has something to do.
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==' \
            | base64 -d > /tmp/probe.png
          curl -fsS -c $jar -b $jar -X POST \
            "http://127.0.0.1:3000/api/upload?uploadTo=Files&relativePath=probe.png" \
            -F "filedata=@/tmp/probe.png" -o /dev/null
          sudo test -f /srv/nextexplorer/Files/probe.png
          curl -fsS -c $jar -b $jar "http://127.0.0.1:3000/api/thumbnails/Files/probe.png" -o /dev/null
          # The database and the cache are where the configuration puts them.
          sudo test -f /var/lib/nextexplorer/app.db
          sudo find /var/cache/nextexplorer -type f | head -3

      - name: And the program directory is exactly as it was
        run: |
          set -eu
          sudo find /opt/nextexplorer -type f -exec sha256sum {} + | sort > /tmp/after.sums
          if ! diff -u /tmp/before.sums /tmp/after.sums; then
            echo "Something under /opt/nextexplorer changed while the application ran."
            exit 1
          fi
          echo "Not one file changed, and none appeared."

      - name: Removing it by hand leaves the data
        run: |
          set -eux
          sudo systemctl disable --now nextexplorer
          sudo rm -f /etc/systemd/system/nextexplorer.service
          sudo systemctl daemon-reload
          sudo rm -rf /opt/nextexplorer
          sudo test -f /var/lib/nextexplorer/app.db
          sudo test -f /srv/nextexplorer/Files/probe.png

  # The other half of what the page offers: somebody who would rather keep one
  # Node for the machine deletes the runtime and points at their own. It only
  # works on the major the native modules were built for, and that is the whole
  # reason this job exists.
  system-node:
    name: With the machine's own Node 24
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: A Node of the machine's own
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'

      - name: Take the archive
        uses: actions/download-artifact@v6
        with:
          name: standalone-x64

      - name: Unpack, and throw the bundled runtime away
        run: |
          set -eux
          tar -xzf ./*.tar.gz
          dir="$(find . -maxdepth 1 -type d -name 'nextexplorer-*' | head -1)"
          du -sh "$dir" "$dir/runtime"
          rm -rf "$dir/runtime"
          du -sh "$dir"
          echo "RELEASE_DIR=$(realpath "$dir")" >> "$GITHUB_ENV"

      - name: Run it with that Node
        run: |
          set -eux
          node -v
          mkdir -p /tmp/data/config /tmp/data/cache /tmp/data/volumes/Files
          cd "$RELEASE_DIR/app"
          CONFIG_DIR=/tmp/data/config CACHE_DIR=/tmp/data/cache \
          VOLUME_ROOT=/tmp/data/volumes SESSION_SECRET=a-secret-for-this-job \
          PATH="$RELEASE_DIR/bin:$PATH" \
            node src/server.js > /tmp/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health || { cat /tmp/server.log; exit 1; }
          features="$(curl -fsS http://127.0.0.1:3000/api/features)"
          echo "$features" | grep -q '"app":"'"$(cat "$RELEASE_DIR/VERSION")"'"'
          # The three native modules loaded under a runtime that did not come
          # with them, which is the claim being tested.
          if grep -qE 'MODULE_NOT_FOUND|NODE_MODULE_VERSION|invalid ELF|cannot open shared object' /tmp/server.log; then
            cat /tmp/server.log
            exit 1
          fi
          echo "$features" | grep -q '"rar"'

  # A bare distribution image, where nothing is installed and the package
  # manager has to do its part. No systemd in here, so the service is started
  # by hand; what is under test is the dependency step and that the payload
  # runs on a machine with no compiler and no Node.
  bare:
    name: A bare ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
          - fedora:42
    steps:
      - name: The few things needed to unpack an archive
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip hostname
          else
            dnf install -y ca-certificates curl tar gzip hostname shadow-utils
          fi

      - name: Take the archive
        uses: actions/download-artifact@v6
        with:
          name: standalone-x64

      - name: Unpack
        run: |
          set -eux
          tar -xzf ./*.tar.gz
          echo "RELEASE_DIR=$(realpath "$(find . -maxdepth 1 -type d -name 'nextexplorer-*' | head -1)")" >> "$GITHUB_ENV"

      - name: Install, with the package manager doing its part
        run: |
          "$RELEASE_DIR/install.sh" --yes --no-service

      - name: It runs, on a machine with no Node and no compiler
        shell: bash
        run: |
          set -eux
          command -v node && { echo "this image has node after all; the test proves less than it claims"; } || true
          set -a; . /etc/nextexplorer/nextexplorer.env; set +a
          export PATH="/opt/nextexplorer/bin:$PATH"
          cd /opt/nextexplorer/app
          /opt/nextexplorer/runtime/bin/node src/server.js > /tmp/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PORT:-3000}/health" >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${PORT:-3000}/health" || { cat /tmp/server.log; exit 1; }
          features="$(curl -fsS "http://127.0.0.1:${PORT:-3000}/api/features")"
          echo "$features" | grep -q "\"app\":\"$(cat "$RELEASE_DIR/VERSION")\""
          echo "$features" | grep -q '"rar"'
          # The ways a bundled native module fails: not found, built for
          # another ABI, or linked against something this machine has not got.
          # A plain search for "error" would catch the name of a middleware.
          if grep -qE 'MODULE_NOT_FOUND|NODE_MODULE_VERSION|invalid ELF|cannot open shared object' /tmp/server.log; then
            cat /tmp/server.log
            exit 1
          fi
          tail -5 /tmp/server.log

      - name: What the dependency step managed on this distribution
        run: |
          set -eu
          for tool in ffprobe rg pdftotext perl rsync; do
            if command -v "$tool" >/dev/null; then echo "  $tool: yes"; else echo "  $tool: NO"; fi
          done

  # Only now, and only for a release: the archive goes on the release itself.
  publish:
    name: Attach to the release
    if: github.event_name == 'release'
    needs:
      - install
      - bare
      - by-hand
      - system-node
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Take both archives
        uses: actions/download-artifact@v6
        with:
          pattern: standalone-*
          merge-multiple: true

      - name: Upload them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ls -la
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" --clobber \
            ./*.tar.gz ./*.tar.gz.sha256
