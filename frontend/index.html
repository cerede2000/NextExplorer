<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <meta id="theme-color" name="theme-color" content="#ffffff" />

    <style>
      /* Prevent a white flash before the app CSS loads in Vite dev. */
      html {
        background-color: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background-color: #212121;
        color-scheme: dark;
      }
      body {
        background-color: transparent;
      }

      .logo-loader {
        width: 64px;
        height: 64px;
        display: inline-block;
        perspective: 800px;
      }

      .logo-loader__img {
        width: 100%;
        height: 100%;
        display: block;
        transform-style: preserve-3d;
        animation: logoFlip 2.4s linear infinite;
        will-change: transform;
      }

      /* Flip horizontally (Y axis) and slow down when facing the viewer. */
      @keyframes logoFlip {
        0% {
          transform: rotateY(0deg);
          animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
        }
        50% {
          transform: rotateY(180deg);
          animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
        }
        100% {
          transform: rotateY(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-loader__img {
          animation: none;
        }
      }
    </style>

    <script>
      (() => {
        try {
          const mode = localStorage.getItem('settings:theme') || 'auto';
          const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;

          const isDark = mode === 'dark' || (mode === 'auto' && prefersDark);

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          const themeColorMeta = document.querySelector('meta#theme-color');
          themeColorMeta?.setAttribute('content', isDark ? '#212121' : '#ffffff');
        } catch (_) {}
      })();
    </script>

    <!--
      Everything this page needs is under /assets/, including the icons.

      A share is opened by somebody who may be on the far side of an
      authentication proxy, which lets a public link through by path: the shorter
      the list of paths, the likelier the hole is cut correctly. Icons sitting at
      the root were three refusals before the first byte of the share arrived.
    -->
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="NextExplorer" />
    <link rel="manifest" href="/assets/site.webmanifest" crossorigin="use-credentials" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer</title>
  </head>
  <body class="text-neutral-900 dark:text-neutral-300 bg-white dark:bg-default">
    <div id="app" class="min-h-dvh w-full font-normal">
      <div
        id="boot"
        style="
          width: 100dvw;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          gap: 1.5rem;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 1rem;
        "
      >
        <div class="logo-loader" role="status" aria-label="Loading">
          <!--
            Drawn rather than fetched: this is the first thing anybody sees, and a
            request for it is one more thing that can be slow, cached away, or —
            behind an authentication proxy — refused outright, leaving the broken
            image somebody opening a share link would be greeted by.
          -->
          <svg
            class="logo-loader__img"
            viewBox="0 0 96 96"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <linearGradient
              id="a"
              gradientUnits="userSpaceOnUse"
              x1="29.86"
              x2="29.86"
              y1="21.003"
              y2="72.2939"
            >
              <stop offset="0" stop-color="#fecb50" />
              <stop offset="1" stop-color="#f9b54b" />
            </linearGradient>
            <linearGradient
              id="b"
              gradientUnits="userSpaceOnUse"
              x1="30.96"
              x2="30.96"
              y1="65.9392"
              y2="20.3341"
            >
              <stop offset="0" stop-color="#f9a22f" />
              <stop offset="1" stop-color="#f8ba37" />
            </linearGradient>
            <linearGradient
              id="c"
              gradientUnits="userSpaceOnUse"
              x1="65.04"
              x2="65.04"
              y1="65.1732"
              y2="29.7664"
            >
              <stop offset="0" stop-color="#f9a22f" />
              <stop offset="1" stop-color="#f8ba37" />
            </linearGradient>
            <linearGradient
              id="d"
              gradientUnits="userSpaceOnUse"
              x1="66.435"
              x2="66.435"
              y1="19.9817"
              y2="75.7713"
            >
              <stop offset="0" stop-color="#fecb50" />
              <stop offset="1" stop-color="#f9b54b" />
            </linearGradient>
            <path d="m43.57 66.49-27.42 10.17v-57.32z" fill="url(#a)" />
            <path d="m45.77 30.9601v34.7199l-2.2.81-27.42-47.15z" fill="url(#b)" />
            <path d="m79.85 76.66-29.62-10.98v-34.7199l2.79-1.0901z" fill="url(#c)" />
            <path d="m79.85 19.34v57.32l-26.83-46.79z" fill="url(#d)" />
          </svg>
        </div>
        <!--
          Said only if the application never arrives.

          Mounting empties this element, so anything written here is gone the
          moment the page is running — which is why it can be written without
          asking anybody's permission first. Until then this logo is the whole
          interface, and it used to spin for as long as somebody was willing to
          watch it: a bundle refused by whatever stands in front of this server
          looks exactly like a page that is merely slow.

          English, and not a translation: this runs before the locales exist.
        -->
        <p id="boot-trouble" style="display: none; max-width: 32rem; font-size: 0.875rem"></p>
      </div>
    </div>
    <script>
      (() => {
        // A file this page asked for never arrived. An authentication proxy in
        // front of the application answers an expired session with a redirect
        // to its own sign-in page, and a browser will not run that as a module
        // — so the page loads, the logo spins, and nothing else ever happens.
        let aFileWasRefused = false;
        window.addEventListener(
          'error',
          (event) => {
            if (event.target && event.target !== window && event.target.src) {
              aFileWasRefused = true;
            }
          },
          true
        );

        // Long enough that a slow connection is not accused of anything.
        setTimeout(() => {
          const splash = document.getElementById('boot');
          const trouble = document.getElementById('boot-trouble');
          // Mounting emptied this: the application is here and this is moot.
          if (!splash || !splash.isConnected || !trouble) return;
          trouble.textContent = aFileWasRefused
            ? 'This page could not load the application\u2019s files. Something in front of this server turned them away \u2014 often a sign-in that has run out. Reload the page, or sign in again.'
            : 'This is taking longer than it should. Reload the page, or sign in again.';
          trouble.style.display = 'block';
          const ways = document.createElement('span');
          ways.style.cssText = 'display:flex;gap:1rem;font-size:0.875rem';
          const again = document.createElement('a');
          again.href = window.location.href;
          again.textContent = 'Reload';
          again.style.textDecoration = 'underline';
          const signIn = document.createElement('a');
          signIn.href = '/auth/login';
          signIn.textContent = 'Sign in';
          signIn.style.textDecoration = 'underline';
          ways.append(again, signIn);
          trouble.insertAdjacentElement('afterend', ways);
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
